services:
  bot:
    build: .
    container_name: quote-search-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - quote_bot_data:/data
      - ./paintings:/app/paintings:ro
      # the primary corpus: put result.json next to this file before the
      # first start; after the initial indexing the line can be removed
      # (updates come via /resync)
      - ./result.json:/app/result.json:ro

volumes:
  quote_bot_data:
